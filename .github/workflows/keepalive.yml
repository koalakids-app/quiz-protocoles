name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours a 06h17 UTC
  workflow_dispatch:        # permet aussi de lancer a la main

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/quiz?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $CODE"
          cat /tmp/out.txt
          if [ "$CODE" != "200" ]; then
            echo "::error::Supabase a repondu $CODE — le projet est peut-etre en pause."
            exit 1
          fi

      - name: Garder le workflow actif
        uses: actions/checkout@v4

      - name: Horodatage
        run: |
          date -u +"Dernier ping : %Y-%m-%d %H:%M UTC" > .keepalive
          git config user.name "keepalive-bot"
          git config user.email "actions@github.com"
          git add .keepalive
          git diff --staged --quiet || git commit -m "keepalive $(date -u +%F)"
          git push
