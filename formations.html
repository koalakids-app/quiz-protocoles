<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micro-formations — Koalakids</title>
<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#E8621A;
  --orange-light:#FDF0E8;
  --orange-dark:#C45112;
  --purple:#4A3F9F;
  --purple-light:#EEEDFE;
  --bg:#FBF7F4;
  --surface:#FFFFFF;
  --surface-2:#FEF9F6;
  --border:rgba(232,98,26,0.15);
  --border-strong:rgba(232,98,26,0.3);
  --text:#2D1F0E;
  --text-muted:#7A5C3F;
  --text-light:#B8956A;
  --radius:10px;
  --success-bg:#EAF6EE;
  --success-border:#2EBD6A;
  --success-text:#0F6E35;
  --danger-bg:#FDF0EE;
  --danger-border:#E07060;
  --danger-text:#993C1D;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}

/* HEADER */
.app-header{background:var(--purple);color:white;padding:.9rem 1.5rem;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(74,63,159,.25)}
.header-logo{height:44px;border-radius:6px;background:white;padding:3px 6px}
.header-title{flex:1}
.header-title h1{font-size:16px;font-weight:700;letter-spacing:-.2px}
.header-title p{font-size:11px;opacity:.75;margin-top:1px}
.header-score-chip{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;white-space:nowrap}

/* CONTAINER */
.container{max-width:660px;margin:0 auto;padding:1.5rem 1rem 4rem}

/* PROGRESS */
.progress-wrap{background:var(--surface);border-radius:var(--radius);padding:1rem 1.25rem;margin-bottom:1.25rem;border:1px solid var(--border)}
.progress-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.progress-label{font-size:13px;color:var(--text-muted)}
.progress-count{font-size:13px;font-weight:700;color:var(--orange)}
.progress-bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--orange),#F5963A);border-radius:4px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* QUESTION */
.question-card{background:var(--surface);border-radius:14px;border:1px solid var(--border);padding:1.5rem;margin-bottom:1rem}
.q-badge{display:inline-flex;align-items:center;gap:6px;background:var(--orange-light);color:var(--orange);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 10px;border-radius:20px;margin-bottom:12px;border:1px solid rgba(232,98,26,.2)}
.q-text{font-size:16px;font-weight:500;color:var(--text);line-height:1.55;margin-bottom:1.25rem}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:border-color .15s,background .15s,transform .1s;user-select:none}
.option:hover:not(.disabled){border-color:var(--orange);background:var(--orange-light);transform:translateX(3px)}
.option.selected{border-color:var(--orange);background:var(--orange-light)}
.option.correct{border-color:var(--success-border);background:var(--success-bg)}
.option.wrong{border-color:var(--danger-border);background:var(--danger-bg)}
.option.disabled{cursor:default;transform:none}
.option-letter{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text-muted);flex-shrink:0;transition:all .15s;background:white}
.option.selected .option-letter{background:var(--orange);border-color:var(--orange);color:white}
.option.correct .option-letter{background:var(--success-border);border-color:var(--success-border);color:white}
.option.wrong .option-letter{background:var(--danger-border);border-color:var(--danger-border);color:white}
.option-text{font-size:14px;color:var(--text);line-height:1.4}

/* FEEDBACK */
.feedback{margin-top:12px;padding:10px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;display:none;align-items:flex-start;gap:8px}
.feedback.show{display:flex}
.feedback.ok{background:var(--success-bg);color:var(--success-text);border:1px solid var(--success-border)}
.feedback.ko{background:var(--danger-bg);color:var(--danger-text);border:1px solid var(--danger-border)}

/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 22px;border:1.5px solid var(--border-strong);border-radius:var(--radius);background:white;color:var(--text);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover:not(:disabled){border-color:var(--orange);color:var(--orange);background:var(--orange-light)}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--orange);color:white;border-color:var(--orange)}
.btn.primary:hover:not(:disabled){background:#D45715;border-color:#D45715;color:white}
.btn.purple{background:var(--purple);color:white;border-color:var(--purple)}
.btn.purple:hover:not(:disabled){background:#3D348E;border-color:#3D348E;color:white}
.pager{font-size:13px;color:var(--text-muted);font-weight:500}

/* START SCREEN */
.start-screen{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:2.5rem 2rem;text-align:center}
.start-logo-wrap{margin:0 auto 1.5rem;display:flex;justify-content:center}
.start-logo-wrap img{height:80px}
.start-screen h2{font-size:22px;font-weight:700;color:var(--purple);margin-bottom:8px}
.start-screen .subtitle{font-size:15px;color:var(--text-muted);margin-bottom:2rem;line-height:1.6}
.start-meta{display:flex;justify-content:center;gap:20px;margin-bottom:2rem;flex-wrap:wrap}
.start-meta-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-muted);background:var(--orange-light);padding:5px 14px;border-radius:20px;border:1px solid rgba(232,98,26,.2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex-shrink:0}

/* FORM */
.form-group{text-align:left;margin-bottom:1rem}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.form-input,.form-select{width:100%;padding:10px 14px;border:1.5px solid var(--border-strong);border-radius:var(--radius);font-size:15px;font-family:inherit;color:var(--text);background:white;transition:border-color .15s;outline:none}
.form-input:focus,.form-select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(232,98,26,.12)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* RESULTS */
.results{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:2rem 1.5rem;text-align:center}
.result-icon{font-size:52px;margin-bottom:8px}
.result-score{font-size:56px;font-weight:800;color:var(--orange);line-height:1;margin-bottom:4px}
.result-total{font-size:18px;color:var(--text-muted);margin-bottom:4px}
.result-mention{font-size:20px;font-weight:700;margin-bottom:1.5rem}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:1.5rem 0}
.result-stat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px}
.result-stat-val{font-size:26px;font-weight:800;line-height:1;margin-bottom:4px}
.result-stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.result-user-recap{background:var(--orange-light);border:1px solid rgba(232,98,26,.2);border-radius:var(--radius);padding:12px 16px;margin:1rem 0;font-size:14px;color:var(--text-muted)}
.result-user-recap strong{color:var(--text);display:block;font-size:16px;margin-bottom:2px}
.result-actions{display:flex;gap:10px;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
.save-status{font-size:13px;color:var(--text-muted);margin-top:.75rem;min-height:20px}
.save-status.ok{color:var(--success-text)}
.save-status.err{color:var(--danger-text)}

@media(max-width:480px){
  .container{padding:1rem .75rem 3rem}
  .question-card{padding:1.25rem 1rem}
  .form-row{grid-template-columns:1fr}
  .result-score{font-size:42px}
  .result-grid{gap:8px}
  .result-stat{padding:10px 6px}
  .result-stat-val{font-size:20px}
}

.center-msg{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:2.5rem 2rem;text-align:center;color:var(--text-muted)}
.spinner{width:34px;height:34px;border:3px solid var(--border-strong);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
table tr:last-child{border-bottom:none!important}
textarea.form-input{font-family:inherit;line-height:1.5}
.tabs{display:flex;gap:6px;margin-bottom:1.5rem;border-bottom:1.5px solid var(--border);padding-bottom:0}
.tab{background:none;border:none;border-bottom:2.5px solid transparent;padding:9px 18px;font-size:14px;font-weight:600;font-family:inherit;color:var(--text-muted);cursor:pointer;transition:all .15s;margin-bottom:-1.5px}
.tab:hover{color:var(--orange)}
.tab.on{color:var(--orange);border-bottom-color:var(--orange)}
.addbar{display:flex;flex-wrap:wrap;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:1.25rem;position:sticky;top:74px;z-index:50}
.btn.addb{padding:6px 12px;font-size:12px;gap:5px}

.readbar{position:sticky;top:68px;z-index:99;height:3px;background:transparent}
.readbar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#F5963A);transition:width .1s linear}
.m-hero{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem 1.75rem;margin-bottom:1.25rem}
.m-tag{display:inline-block;background:var(--purple-light);color:var(--purple);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 12px;border-radius:20px;margin-bottom:14px}
.m-hero h2{font-size:24px;font-weight:800;color:var(--purple);line-height:1.25;margin-bottom:14px;letter-spacing:-.3px}
.m-hero p{font-size:15px;color:var(--text-muted);margin-bottom:10px}
.m-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.75rem;margin-bottom:1.25rem}
.m-block h3{font-size:19px;font-weight:700;color:var(--text);margin-bottom:12px;letter-spacing:-.2px}
.m-block p{font-size:15px;color:var(--text-muted);margin-bottom:12px}
.m-block strong{color:var(--text);font-weight:600}
.m-quote{background:var(--orange-light);border-left:3px solid var(--orange);border-radius:0 var(--radius) var(--radius) 0;padding:16px 20px;font-size:16px;font-weight:600;color:var(--orange-dark);line-height:1.5;margin-top:18px}
.m-scene{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-top:14px}
.m-scene-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.m-scene-n{width:26px;height:26px;border-radius:50%;background:var(--purple);color:white;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.m-scene-h h4{font-size:15px;font-weight:700;color:var(--text);line-height:1.3}
.m-scene p{font-size:14px;margin-bottom:10px}
.m-scene-r{border-left:2px solid var(--border-strong);padding-left:12px;margin-bottom:0!important}
.m-pause{background:var(--purple-light);border:1px solid rgba(74,63,159,.2);border-radius:14px;padding:1.5rem;margin-bottom:1.25rem}
.m-pause-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--purple);margin-bottom:10px}
.m-pause-q{font-size:16px;font-weight:600;color:var(--text);line-height:1.5;margin-bottom:8px}
.m-pause-sub{font-size:13px;color:var(--purple);opacity:.85;margin-bottom:14px;line-height:1.5}
.m-input{width:100%;padding:12px 14px;border:1.5px solid rgba(74,63,159,.25);border-radius:var(--radius);font-size:14px;font-family:inherit;color:var(--text);background:white;outline:none;resize:vertical;line-height:1.5}
.m-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(74,63,159,.1)}
.m-pause-note{font-size:12px;color:var(--purple);opacity:.7;margin-top:8px}
.m-do{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}
.m-do-col{border-radius:var(--radius);padding:16px 18px;border:1px solid}
.m-do-col.ok{background:var(--success-bg);border-color:var(--success-border)}
.m-do-col.ko{background:var(--danger-bg);border-color:var(--danger-border)}
.m-do-col h5{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.m-do-col.ok h5{color:var(--success-text)}
.m-do-col.ko h5{color:var(--danger-text)}
.m-do-col ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.m-do-col li{font-size:14px;line-height:1.45;padding-left:17px;position:relative;color:var(--text)}
.m-do-col.ok li::before{content:'\2713';position:absolute;left:0;color:var(--success-border);font-weight:700}
.m-do-col.ko li::before{content:'\00d7';position:absolute;left:0;color:var(--danger-border);font-weight:700}
.m-list{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:6px}
.m-list li{font-size:15px;line-height:1.55;color:var(--text-muted);padding-left:18px;position:relative}
.m-list li::before{content:'';position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--purple)}
.m-list strong{color:var(--text)}
.m-key{background:var(--surface);border:2px solid var(--orange);border-radius:14px;padding:1.75rem;margin-bottom:1.25rem}
.m-key h3{font-size:17px;font-weight:700;color:var(--orange);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.m-key ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.m-key li{font-size:15px;line-height:1.5;padding-left:22px;position:relative;color:var(--text)}
.m-key li::before{content:'';position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.m-try{background:var(--purple);color:white;border-radius:14px;padding:1.75rem;margin-bottom:1.25rem}
.m-try-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;opacity:.75;margin-bottom:8px}
.m-try h3{font-size:19px;font-weight:700;margin-bottom:16px;letter-spacing:-.2px}
.m-try-list{list-style:none;counter-reset:t;display:flex;flex-direction:column;gap:14px}
.m-try-list li{font-size:15px;line-height:1.55;padding-left:34px;position:relative;opacity:.95}
.m-try-list li::before{counter-increment:t;content:counter(t);position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.m-try-note{font-size:13px;opacity:.75;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.2);line-height:1.5}
.m-end{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:2rem 1.5rem;text-align:center;margin-bottom:1rem}
.m-end p{font-size:16px;font-weight:600;color:var(--purple);margin-bottom:1.25rem}
.m-end-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.m-foot{text-align:center;font-size:12px;color:var(--text-light);padding-bottom:2rem}
  .m-hero,.m-block,.m-key,.m-try{padding:1.35rem 1.15rem}
  .m-hero h2{font-size:20px}
  .m-block h3,.m-try h3{font-size:17px}
.m-fig{margin:1.25rem 0}
.m-fig img{width:100%;border-radius:12px;border:1px solid var(--border);display:block}
.m-fig figcaption{font-size:12px;color:var(--text-light);text-align:center;margin-top:6px;font-style:italic}


.container{max-width:720px}
.readbar{position:sticky;top:68px;z-index:99;height:3px;background:transparent}
.readbar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--orange),#F5963A);transition:width .1s linear}
.center-msg{background:var(--surface);border-radius:16px;border:1px solid var(--border);padding:2.5rem 2rem;text-align:center;color:var(--text-muted)}
.spinner{width:34px;height:34px;border:3px solid var(--border-strong);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem}
@keyframes spin{to{transform:rotate(360deg)}}
.m-fig{margin:1.25rem 0}
.m-fig img{width:100%;border-radius:12px;border:1px solid var(--border);display:block}
.m-fig figcaption{font-size:12px;color:var(--text-light);text-align:center;margin-top:6px;font-style:italic}
.m-video-cadre{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.m-video-cadre video,.m-video-cadre iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.m-video-titre{font-size:15px;margin:0 0 8px}

/* QUESTIONS ET MISES EN SITUATION (e-learning) */
.m-q,.m-dlg{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem 1.25rem;margin-bottom:1.25rem}
.m-q-label,.m-dlg-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--purple);margin-bottom:10px}
.m-q-enonce{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:12px}
.m-q-opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.m-q-opt{display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;padding:11px 14px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius);font:inherit;font-size:14px;line-height:1.5;color:var(--text);cursor:pointer;transition:border-color .15s,background .15s}
.m-q-opt:hover{border-color:var(--border-strong)}
.m-q-mark{flex:0 0 18px;height:18px;margin-top:2px;border:1.5px solid var(--border-strong);border-radius:50%;background:white}
.m-q[data-multi="1"] .m-q-mark{border-radius:4px}
.m-q-opt.sel{border-color:var(--purple);background:var(--purple-light)}
.m-q-opt.sel .m-q-mark{background:var(--purple);border-color:var(--purple);box-shadow:inset 0 0 0 3px white}
.m-q[data-done="1"] .m-q-opt{cursor:default}
.m-q-opt.juste{border-color:var(--success-border);background:var(--success-bg)}
.m-q-opt.juste .m-q-mark{background:var(--success-border);border-color:var(--success-border);box-shadow:inset 0 0 0 3px white}
.m-q-opt.faux{border-color:var(--danger-border);background:var(--danger-bg)}
.m-q-opt.faux .m-q-mark{background:var(--danger-border);border-color:var(--danger-border);box-shadow:inset 0 0 0 3px white}
.m-q-fb{font-size:14px;font-weight:600;padding:10px 14px;border-radius:var(--radius);margin-top:4px;background:var(--surface-2);border:1px solid var(--border)}
.m-q-fb.ok{background:var(--success-bg);color:var(--success-text);border-color:var(--success-border)}
.m-q-fb.ko{background:var(--danger-bg);color:var(--danger-text);border-color:var(--danger-border)}
.m-q-expl{font-size:14px;line-height:1.6;color:var(--text-muted);margin-top:10px}
.m-dlg h3{font-size:18px;margin-bottom:8px}
.m-dlg-ctx{font-size:14px;line-height:1.6;color:var(--text-muted);margin-bottom:12px}
.m-dlg-bulle{background:var(--purple-light);border-radius:14px 14px 14px 4px;padding:10px 14px;margin:0 0 10px;max-width:92%}
.m-dlg-bulle strong{display:block;font-size:12px;color:var(--purple);margin-bottom:2px}
.m-dlg-bulle p{font-size:14px;line-height:1.55;margin:0}
.m-dlg-consigne{font-size:15px;font-weight:600;margin:14px 0 8px}
.m-dlg .btn{margin-top:10px}
.m-dlg-rep{margin-top:12px;padding:12px 14px;background:var(--success-bg);border:1px solid var(--success-border);border-radius:var(--radius);font-size:14px;line-height:1.6}
.m-dlg-rep ul{margin:8px 0 0 18px}
.m-q [hidden],.m-dlg [hidden]{display:none!important}
.m-do+.m-q,.m-do+.m-dlg{margin-top:1.25rem}

/* \u00c9CHANGES ENTRE PARTICIPANTS (messages relus avant affichage) */
.m-disc{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.4rem 1.25rem;margin-bottom:1.25rem}
.m-disc-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--purple);margin-bottom:10px}
.m-disc h3{font-size:18px;margin-bottom:8px}
.m-disc-consigne{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:8px}
.m-disc-rappel{font-size:12.5px;line-height:1.5;color:var(--purple);background:var(--purple-light);border-radius:var(--radius);padding:8px 12px;margin-bottom:12px}
.m-disc-liste{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.m-disc-msg{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.m-disc-msg.attente{background:#fff;border-style:dashed}
.m-disc-msg strong{font-size:13px;color:var(--purple)}
.m-disc-msg time{font-size:11px;color:var(--text-light);margin-left:8px}
.m-disc-msg p{font-size:14px;line-height:1.55;margin:4px 0 0;white-space:pre-line;overflow-wrap:anywhere}
.m-disc-vide,.m-disc-aide{font-size:12.5px;line-height:1.5;color:var(--text-light)}
.m-disc-form label{display:block;margin-bottom:6px}
.m-disc-pied{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.m-disc-fb{font-size:13px;font-weight:600;margin-top:10px}
.m-disc-fb.ok{color:var(--success-text)}
.m-disc-fb.ko{color:var(--danger-text)}
.m-disc-hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.m-disc [hidden]{display:none!important}
.m-end-actions a.btn{text-decoration:none}
/* MICROSÉQUENCE (trame de séance de 45 min) */
.sq-fiche{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:1.25rem 1.5rem;margin-bottom:1.25rem}
.sq-fiche dl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}
.sq-fiche dt{color:var(--text-muted);font-weight:600}
.sq-fiche dd{margin:0}
.sq-objectif{background:var(--orange-light);border-left:4px solid var(--orange);border-radius:0 var(--radius) var(--radius) 0;padding:10px 14px;font-weight:600;margin-top:12px}
.sq-titre{font-size:16px;font-weight:700;color:var(--purple);margin:1.5rem 0 .6rem}
.sq-etape{display:flex;gap:12px;margin-bottom:8px}
.sq-t{flex:0 0 82px;text-align:center;background:var(--purple);color:#fff;border-radius:var(--radius);font-size:13px;font-weight:700;padding:8px 4px;align-self:flex-start}
.sq-b{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px}
.sq-b h4{font-size:14px;font-weight:700;color:var(--purple);margin:0 0 3px}
.sq-b p,.sq-b li{font-size:13.5px;color:var(--text-muted)}
.sq-b ul{margin:4px 0 0 18px}
.sq-regles{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px}
.sq-regles li{font-size:14px;margin:4px 0 4px 18px}
@media(max-width:560px){.sq-fiche dl{grid-template-columns:1fr}.sq-etape{flex-direction:column;gap:4px}.sq-t{flex:none;padding:4px}}
.p-nav{font-size:13px;color:var(--text-muted);margin:0 0 1rem}
.p-nav a{color:var(--purple);font-weight:600;text-decoration:none}
.p-list{display:flex;flex-direction:column;gap:10px;margin:1.25rem 0}
.p-item{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.1rem;text-decoration:none;color:inherit}
.p-item:hover{border-color:var(--orange)}
.p-num{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--purple);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.p-item.lu .p-num{background:#2E8B57}
.p-item h4{font-size:15px;font-weight:700;color:var(--purple);margin:0 0 3px}
.p-item p{font-size:13px;color:var(--text-muted);margin:0;line-height:1.5}
.p-lu{font-size:12px;color:#2E8B57;font-weight:700;margin-top:4px}
.p-bar{position:sticky;bottom:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 12px;margin-top:1rem;box-shadow:0 -4px 14px rgba(74,63,159,.10)}
.p-bar a.btn,.p-bar span.btn{text-decoration:none;padding:9px 14px;font-size:13.5px}
.p-bar .off{opacity:.35;pointer-events:none}
.p-bar .pos{font-size:12.5px;color:var(--text-muted);font-weight:600;text-align:center}
@media(max-width:480px){.cat-intro{padding:1.5rem 1.25rem}.cat-intro h1{font-size:20px}}

</style>

/* Identifiant de la fiche collaborateur/trice (gestion-stock), transmis dans
   le lien envoyé par la direction — même principe que `ref` sur index.html
   (quiz) : sert uniquement à rattacher la lecture, jamais utilisé pour
   afficher quoi que ce soit ici. */
const PRE_REF=(new URLSearchParams(location.search).get('ref')||'').trim();
const PRE_PRENOM=(new URLSearchParams(location.search).get('prenom')||'').trim().slice(0,40);
const PRE_CRECHE=(new URLSearchParams(location.search).get('creche')||'').trim().slice(0,80);
let _luEnregistre=false;
async function marquerLu(moduleId){
  if(!PRE_REF||_luEnregistre)return;
  _luEnregistre=true;
  /* insert et non upsert : l'anonyme n'a que le droit d'insertion (cf. sql/formations_lu.sql),
     alors qu'un upsert (ON CONFLICT DO UPDATE) exige aussi select/update et était refusé. Un
     doublon (23505) veut simplement dire que la lecture est déjà enregistrée. */
  try{
    const{error}=await db.from('formations_lu').insert({module_id:moduleId,ref:PRE_REF});
    if(error&&error.code!=='23505'){console.warn('[formations_lu]',error);_luEnregistre=false;}
  }catch(e){console.warn('[formations_lu]',e);_luEnregistre=false;}
}
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mdBold=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');

}

/* ---------- RENDU DES BLOCS ---------- */
function blocHTML(b){
  const c=b.contenu||{};
  switch(b.type){
    case 'texte':return `<section class="m-block">
      ${c.titre?`<h3>${esc(c.titre)}</h3>`:''}

      ${c.titre?`<h3>${esc(c.titre)}</h3>`:''}
      ${(c.items||[]).map(s=>`<div class="m-scene">
        <div class="m-scene-h"><span class="m-scene-n">${esc(s.lettre)}</span><h4>${esc(s.titre)}</h4></div>
        ${s.texte?`<p>${mdBold(s.texte)}</p>`:''}
        ${s.analyse?`<p class="m-scene-r"><strong>Ce qui se passe :</strong> ${mdBold(s.analyse)}</p>`:''}

/* Vidéo : lien YouTube (iframe) ou fichier MP4 (lecteur natif) */
function videoYoutubeId(u){
  const m=String(u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/);
  return m?m[1]:'';
}
function videoHTML(c){
  if(!c.url)return '';
  const yt=videoYoutubeId(c.url);
  const lecteur=yt
    ?`<iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="${esc(c.titre||'Vid\u00e9o')}" allow="accelerometer;encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe>`
    :`<video controls preload="metadata" playsinline src="${esc(c.url)}"${c.poster?` poster="${esc(c.poster)}"`:''}></video>`;
  return `<figure class="m-fig m-video">${c.titre?`<h3 class="m-video-titre">${esc(c.titre)}</h3>`:''}<div class="m-video-cadre">${lecteur}</div>${c.legende?`<figcaption>${esc(c.legende)}</figcaption>`:''}</figure>`;
}

/* Questions : choix, validation et correction immédiate (rien n'est enregistré) */
function qChoisir(btn){
  const s=btn.closest('.m-q');if(!s||s.dataset.done)return;
  if(s.dataset.multi==='1'){btn.classList.toggle('sel');}
  else{s.querySelectorAll('.m-q-opt').forEach(b=>{b.classList.remove('sel');b.setAttribute('aria-pressed','false');});btn.classList.add('sel');}
  btn.setAttribute('aria-pressed',btn.classList.contains('sel')?'true':'false');
  repSauverQ(s);
}
function qValider(btn,restaure){
  const s=btn.closest('.m-q');if(!s||s.dataset.done)return;
  const opts=[...s.querySelectorAll('.m-q-opt')],fb=s.querySelector('.m-q-fb');
  if(!opts.some(o=>o.classList.contains('sel'))){fb.hidden=false;fb.className='m-q-fb';fb.textContent='Choisissez au moins une r\u00e9ponse.';return;}
  let ok=true;
  opts.forEach(o=>{const j=o.dataset.juste==='1',sel=o.classList.contains('sel');
    if(j)o.classList.add('juste');else if(sel)o.classList.add('faux');
    if(j!==sel)ok=false;});
  s.dataset.done='1';btn.hidden=true;
  fb.hidden=false;fb.className='m-q-fb '+(ok?'ok':'ko');
  fb.textContent=ok?'Bonne r\u00e9ponse.':'Pas tout \u00e0 fait : les bonnes r\u00e9ponses sont indiqu\u00e9es en vert.';
  const ex=s.querySelector('.m-q-expl');if(ex)ex.hidden=false;
  if(!restaure)repSauverQ(s);
}
/* Réponses conservées pour la session (sessionStorage) afin de survivre à un aller-retour
   entre modules : les pages se rechargent à chaque navigation. Rien n'est transmis. */
const _repKey=()=>_curModuleId?'kk_rep_'+_curModuleId:null;
function repLire(){try{return JSON.parse(sessionStorage.getItem(_repKey())||'{}')||{};}catch(e){return {};}}
function repEcrire(fn){
  const k=_repKey();if(!k)return;
  try{const d=repLire();fn(d);sessionStorage.setItem(k,JSON.stringify(d));}catch(e){}
}
const _repIdx=(el,sel)=>[...document.querySelectorAll(sel)].indexOf(el);
function repSauverQ(s){
  const i=_repIdx(s,'.m-q');if(i<0)return;
  repEcrire(d=>{(d.q=d.q||{})[i]={sel:[...s.querySelectorAll('.m-q-opt')].map((o,j)=>o.classList.contains('sel')?j:-1).filter(j=>j>=0),done:!!s.dataset.done};});
}
function repRestaurer(){
  const d=repLire();
  document.querySelectorAll('.m-q').forEach((s,i)=>{
    const r=d.q&&d.q[i];if(!r)return;
    const opts=[...s.querySelectorAll('.m-q-opt')];
    (r.sel||[]).forEach(j=>{if(opts[j]){opts[j].classList.add('sel');opts[j].setAttribute('aria-pressed','true');}});
    if(r.done)qValider(s.querySelector('.m-q-btn'),true);
  });
  document.querySelectorAll('.m-dlg').forEach((s,i)=>{
    const r=d.dlg&&d.dlg[i];if(!r)return;
    s.querySelector('textarea').value=r.txt||'';
    if(r.rev)dlgReveler(s.querySelector('.m-dlg-rep').previousElementSibling,true);
  });
}
addEventListener('input',e=>{
  const ta=e.target.closest&&e.target.closest('.m-dlg textarea');if(!ta)return;
  const s=ta.closest('.m-dlg'),i=_repIdx(s,'.m-dlg');
  repEcrire(d=>{((d.dlg=d.dlg||{})[i]=d.dlg[i]||{}).txt=ta.value;});
});
function dlgReveler(btn,restaure){
  const r=btn.closest('.m-dlg').querySelector('.m-dlg-rep');
  r.hidden=false;btn.hidden=true;
  if(!restaure){const sc=btn.closest('.m-dlg'),i=_repIdx(sc,'.m-dlg');repEcrire(d=>{((d.dlg=d.dlg||{})[i]=d.dlg[i]||{}).rev=1;});}
}

/* \u00c9changes entre participants : lecture des messages valid\u00e9s (vue publique) et d\u00e9p\u00f4t d'un
   message en attente de relecture. Le contenu est toujours \u00e9chapp\u00e9 (esc), jamais interpr\u00e9t\u00e9. */
const RAPPEL_ECHANGES="Merci de ne citer ni nom d'enfant, ni nom de coll\u00e8gue. Les messages sont relus avant d'\u00eatre affich\u00e9s.";
const dateCourte=d=>{try{return new Date(d).toLocaleDateString('fr-FR',{day:'numeric',month:'short'})}catch(e){return ''}};
async function initEchanges(){
  for(const s of document.querySelectorAll('.m-disc[data-bloc]'))await echangesCharger(s);
}
async function echangesCharger(s){
  const liste=s.querySelector('.m-disc-liste'),id=s.dataset.bloc;
  if(!id){liste.innerHTML='';return;}
  try{
    const{data,error}=await db.from('echanges_valides').select('prenom,message,cree_le').eq('bloc_id',id).order('cree_le',{ascending:true}).limit(200);
    if(error)throw error;
    s._valides=data||[];echangesAfficher(s);
  }catch(e){liste.innerHTML='<p class="m-disc-vide">Les messages ne peuvent pas \u00eatre affich\u00e9s pour le moment.</p>';}
}
function echangesAfficher(s){
  const v=s._valides||[],a=s._attente||[];
  const item=(m,att)=>`<div class="m-disc-msg${att?' attente':''}"><strong>${esc(m.prenom)}</strong><time>${att?'en attente de relecture':esc(dateCourte(m.cree_le))}</time><p>${esc(m.message)}</p></div>`;
  s.querySelector('.m-disc-liste').innerHTML=(v.length||a.length)
    ?v.map(m=>item(m,false)).join('')+a.map(m=>item(m,true)).join('')
    :'<p class="m-disc-vide">Aucun message pour l\'instant. Soyez la premi\u00e8re ou le premier \u00e0 partager.</p>';
}
function echangesCompte(ta){
  const c=ta.closest('.m-disc-form').querySelector('.m-disc-compte');
  if(c)c.textContent=ta.value.length+' / 800';
}
async function echangesEnvoyer(f){
  const s=f.closest('.m-disc'),ta=f.elements.message,btn=f.querySelector('button[type=submit]'),fb=f.querySelector('.m-disc-fb');
  const dire=(t,ok)=>{fb.hidden=false;fb.className='m-disc-fb '+(ok?'ok':'ko');fb.textContent=t;};
  const msg=ta.value.trim();
  if(f.elements.site&&f.elements.site.value){ta.value='';dire('Merci ! Votre message sera visible apr\u00e8s relecture.',true);return false;}  // champ pi\u00e8ge (robots)
  if(msg.length<3){dire('Votre message est trop court.',false);return false;}
  if(!PRE_REF||!PRE_PRENOM||!s.dataset.bloc||!s.dataset.module){dire('Ouvrez la formation depuis votre lien personnel pour \u00e9crire.',false);return false;}
  btn.disabled=true;
  const{error}=await db.from('echanges').insert({module_id:s.dataset.module,bloc_id:s.dataset.bloc,ref:PRE_REF,prenom:PRE_PRENOM,creche:PRE_CRECHE||null,message:msg});
  btn.disabled=false;
  if(error){
    dire(/echanges_limite/.test(error.message||'')?'Vous avez envoy\u00e9 plusieurs messages en peu de temps. R\u00e9essayez dans une heure.':"Votre message n'a pas pu \u00eatre envoy\u00e9. R\u00e9essayez plus tard.",false);
    return false;
  }
  (s._attente=s._attente||[]).push({prenom:PRE_PRENOM,message:msg});
  ta.value='';echangesCompte(ta);echangesAfficher(s);
  dire('Merci ! Votre message sera visible apr\u00e8s relecture.',true);
  return false;
}

/* ---------- PARCOURS (liens groupés) ---------- */
/* Le paramètre ref (lien personnel) et quiz (quiz de fin de parcours, facultatif)
   sont conservés d'un module à l'autre. */
const PRE_QUIZ=(new URLSearchParams(location.search).get('quiz')||'').trim();
function lienPage(page,params){
  const q=new URLSearchParams();
  Object.keys(params).forEach(k=>q.set(k,params[k]));
  if(PRE_REF)q.set('ref',PRE_REF);
  // Identit\u00e9 transmise par le lien du mail : conserv\u00e9e jusqu'au quiz (pr\u00e9remplissage)
  const cur=new URLSearchParams(location.search);
  ['prenom','nom','statut','creche'].forEach(k=>{const v=(cur.get(k)||'').trim();if(v)q.set(k,v);});
  return page+'?'+q.toString();
}
const lienModule=id=>lienPage('formations.html',PRE_QUIZ?{module:id,quiz:PRE_QUIZ}:{module:id});
const lienTheme=id=>lienPage('formations.html',PRE_QUIZ?{theme:id,quiz:PRE_QUIZ}:{theme:id});
const lienQuiz=q=>lienPage('index.html',{quiz:q});

      </div>
    </div>
    <p class="m-foot">Micro-formation Koalakids${nom?' \u00b7 '+esc(nom):''}</p>
    ${(enParcours||qz)?`<div class="p-bar">
      ${precedent?`<a class="btn" href="${esc(lienModule(precedent.id))}">\u2190 Pr\u00e9c\u00e9dent</a>`:'<span class="btn off">\u2190 Pr\u00e9c\u00e9dent</span>'}
      <span class="pos">${enParcours?'Module '+(pos+1)+' / '+freres.length:''}</span>
      ${suivant?`<a class="btn primary" href="${esc(lienModule(suivant.id))}">Suivant \u2192</a>`:(qz?`<a class="btn primary" href="${esc(lienQuiz(qz))}">Passer le quiz \u2192</a>`:'<span class="btn off">Suivant \u2192</span>')}
    </div>`:''}</div>`;
  window.scrollTo(0,0);
  repRestaurer();
  initEchanges();
  // Module tenant enti\u00e8rement \u00e0 l'\u00e9cran : aucun \u00e9v\u00e9nement scroll ne se
  // d\u00e9clenchera jamais, donc rien ne marquerait la lecture sans ce filet.
  setTimeout(()=>{
    const h=document.documentElement;
    if(h.scrollHeight-h.clientHeight<=0)marquerLu(id);
  },300);
}

/* ---------- MICROSÉQUENCE : en-tête, déroulé minuté, règles ----------
   Tout vient de module.trame (JSON) : aucune donnée de formation n'est écrite
   ici. Les champs vides ne sont pas affichés. */
function trameHTML(m,theme){
  const tr=m&&m.trame;
  if(!tr||typeof tr!=='object')return '';
  const ligne=(lib,val)=>val?`<dt>${lib}</dt><dd>${val}</dd>`:'';
  const so=tr.socle||{};
  const socle=so.bloc?`Bloc ${esc(so.bloc)} du Socle national`+(so.attendu?` · ${esc(so.attendu)}`:''):'';
  const mat=Array.isArray(tr.materiel)&&tr.materiel.length?tr.materiel.map(esc).join(' · '):'';
  const num=tr.module_num&&tr.seq?`Module ${esc(tr.module_num)} – ${esc(tr.seq)}/${esc(tr.sur||3)}`:'';
  const etapes=(Array.isArray(tr.deroule)?tr.deroule:[]).map(e=>{
    const liste=(a)=>Array.isArray(a)&&a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
    return `<div class="sq-etape"><div class="sq-t">${esc(e.de)}–${esc(e.a)} min</div><div class="sq-b">
      <h4>${esc(e.nom)}</h4>
      ${e.message?`<p><strong>Message clé :</strong> ${mdBold(e.message)}</p>`:''}
      ${e.consigne?`<p>${mdBold(e.consigne)}</p>`:''}
      ${e.amorce?`<p>« ${esc(e.amorce)} »</p>`:''}
      ${liste(e.idees)}${liste(e.questions)}${liste(e.consignes)}
      ${e.support?`<p>Support : ${esc(e.support)}</p>`:''}</div></div>`;
  }).join('');
  const regles=Array.isArray(tr.regles)&&tr.regles.length
    ?`<h3 class="sq-titre">Règles d'animation</h3><div class="sq-regles"><ul>${tr.regles.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>`:'';
  return `<section class="sq-fiche"><dl>
      ${ligne('Module / séquence',num)}
      ${ligne('Référence au socle',socle)}
      ${ligne('Public',esc(tr.public))}
      ${ligne('Animateur',esc(tr.animateur))}
      ${ligne('Durée',tr.duree_min?esc(tr.duree_min)+' min':'')}
      ${ligne('Matériel',mat)}
    </dl>${tr.objectif?`<div class="sq-objectif">${mdBold(tr.objectif)}</div>`:''}</section>
    ${etapes?`<h3 class="sq-titre">Déroulé minuté</h3>${etapes}`:''}${regles}`;
}

function estimeTemps(blocs){
  let mots=0;
  const compte=v=>{
    if(typeof v==='string')mots+=v.split(/\s+/).filter(Boolean).length;
    else if(Array.isArray(v))v.forEach(compte);
    else if(v&&typeof v==='object')Object.values(v).forEach(compte);
  };
  blocs.forEach(b=>compte(b.contenu));
  // Temps pour r\u00e9pondre : 45 s par question, 2 min 30 par mise en situation
  const actif=blocs.reduce((t,b)=>t+(b.type==='question'?0.75:b.type==='dialogue'?2.5:0),0);
  return Math.max(2,Math.round(mots/180+actif));
}

/* ---------- BARRE DE LECTURE ---------- */
/* La lecture est enregistrée dès que la barre atteint ~95% : c'est le seul
   signal disponible sur une page de contenu sans quiz ni case à cocher. Un
   module trop court pour produire de scroll (page tenant entièrement à
   l'écran) est marqué lu directement, faute de quoi il ne le serait jamais. */
addEventListener('scroll',()=>{
  const h=document.documentElement;
  const d=h.scrollHeight-h.clientHeight;
  const pct=d>0?Math.min(100,h.scrollTop/d*100):100;
  document.getElementById('readbar').style.width=pct+'%';
  if(pct>=95&&_curModuleId)marquerLu(_curModuleId);
});

/* ---------- ROUTAGE ---------- */
function route(){
  const q=new URLSearchParams(location.search);
  const id=q.get('module'),th=q.get('theme');
  if(id)showModule(id);else if(th)showTheme(th);else showAccueil();
}
addEventListener('popstate',route);
route();

</script>
